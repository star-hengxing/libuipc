name: xmake

on:
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '.clang-format'
      - '.clangd'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/cmake.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, windows-2025, ubuntu-22.04, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-xmake-${{ matrix.os }}
        cancel-in-progress: true

    steps:
      - name: Maximize build space
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup cuda
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
        uses: Jimver/cuda-toolkit@v0.2.20
        id: cuda-toolkit
        with:
          cuda: '12.6.3'

      - name: Setup cuda
        if: matrix.os == 'windows-2022' || matrix.os == 'windows-2025'
        uses: MinoruSekine/setup-scoop@main
        with:
          buckets: main
          apps: cuda

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@master
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.os }}

      - name: Xmake configure
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
        run: |
          xmake config --yes --github_actions=y

      - name: Xmake configure
        if: matrix.os == 'windows-2022' || matrix.os == 'windows-2025'
        env:
          CUDA_PATH: "C:/Users/runneradmin/scoop/apps/cuda/current"
        run: |
          xmake config --yes --github_actions=y

      - name: Build libuipc
        run: |
          xmake build geometry
          xmake build --jobs=4 cuda
          xmake build --all
